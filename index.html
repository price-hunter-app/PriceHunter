<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PriceHunter — Ваш личный помощник</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #090f21; color: white; font-family: 'Segoe UI', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); transition: all 0.3s ease; }
        .glass:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.2); }
        .floating { animation: float 6s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-15px); } }
    </style>
</head>
<body class="min-h-screen">

    <!-- Декор фона -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden text-6xl opacity-10">
        <div class="absolute top-20 left-10 floating">🧥</div>
        <div class="absolute top-40 right-20 floating" style="animation-delay: 2s;">👟</div>
        <div class="absolute bottom-40 left-1/3 floating" style="animation-delay: 4s;">📱</div>
        <div class="absolute bottom-20 right-1/4 floating" style="animation-delay: 1s;">⌚</div>
    </div>

    <div class="relative z-10 container mx-auto px-4 py-12">
        <header class="flex flex-col md:flex-row justify-between items-center gap-6 mb-16">
            <h1 class="text-3xl font-black text-white">Price<span class="text-blue-500">Hunter</span> ✦</h1>
            <div class="bg-blue-500/10 text-blue-400 px-6 py-2 rounded-2xl border border-blue-500/20 text-sm font-medium">
                🏗️ Режим разработки: Функции подключаются постепенно
            </div>
        </header>

        <main class="max-w-3xl mx-auto text-center mb-24">
            <h2 class="text-5xl md:text-7xl font-extrabold mb-8 leading-tight">
                Охота за <span class="bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">скидками</span>
            </h2>
            <p class="text-gray-400 text-lg mb-12 max-w-xl mx-auto">
                Вставьте ссылку на любой товар с маркетплейса, и мы добавим его в ваш список для будущего отслеживания цен.
            </p>
            
            <div class="glass p-3 rounded-[2rem] flex flex-col md:flex-row gap-3 shadow-2xl">
                <input id="productUrl" type="text" placeholder="Ссылка на товар (Ozon, WB, AliExpress...)" 
                       class="flex-1 bg-transparent px-6 py-4 outline-none text-white text-lg placeholder:text-gray-600">
                <button onclick="saveProduct()" class="bg-blue-600 hover:bg-blue-500 text-white px-10 py-4 rounded-2xl font-bold transition-all active:scale-95 shadow-lg shadow-blue-600/20">
                    Отслеживать
                </button>
            </div>
            <p id="statusMsg" class="mt-4 text-sm font-medium h-5 transition-all"></p>
        </main>

        <section class="max-w-4xl mx-auto">
            <div class="flex items-center justify-between mb-8">
                <h3 class="text-2xl font-bold flex items-center gap-3">
                    <i class="fa-solid fa-layer-group text-blue-500"></i> Мой список
                </h3>
                <span id="counter" class="bg-gray-800 text-gray-400 px-3 py-1 rounded-lg text-xs">0 товаров</span>
            </div>
            
            <div id="productList" class="grid gap-4">
                <!-- Состояние когда пусто -->
                <div id="emptyState" class="glass p-12 rounded-[2rem] text-center border-dashed border-2 border-white/10">
                    <div class="text-4xl mb-4 opacity-20">📋</div>
                    <p class="text-gray-500">Ваш список пока пуст. Добавьте свою первую ссылку выше!</p>
                </div>
            </div>
        </section>
    </div>

    <script>
        let count = 0;

        function saveProduct() {
            const input = document.getElementById('productUrl');
            const msg = document.getElementById('statusMsg');
            const list = document.getElementById('productList');
            const empty = document.getElementById('emptyState');
            const counter = document.getElementById('counter');

            if (!input.value.trim()) {
                msg.style.color = "#ff4d4d";
                msg.innerText = "Упс! Нужно вставить ссылку.";
                return;
            }

            msg.style.color = "#60a5fa";
            msg.innerText = "Запоминаю товар...";

            setTimeout(() => {
                if (empty) empty.remove();

                const item = document.createElement('div');
                item.className = "glass p-5 rounded-2xl flex items-center justify-between gap-4 animate-move-up";
                item.innerHTML = `
                    <div class="flex items-center gap-4 min-w-0">
                        <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-blue-700 rounded-xl flex items-center justify-center text-xl shadow-inner flex-shrink-0">🏷️</div>
                        <div class="truncate">
                            <p class="text-blue-400 text-[10px] font-bold uppercase tracking-widest mb-1">Товар в очереди</p>
                            <p class="text-gray-200 truncate text-sm italic">${input.value}</p>
                        </div>
                    </div>
                    <div class="flex-shrink-0 bg-white/5 px-3 py-2 rounded-xl border border-white/5">
                        <p class="text-[10px] text-gray-500 uppercase tracking-tighter">Статус</p>
                        <p class="text-[10px] text-yellow-500 font-bold">ЖДЕМ API</p>
                    </div>
                `;

                list.prepend(item);
                count++;
                counter.innerText = `${count} товаров`;
                input.value = "";
                msg.style.color = "#34d399";
                msg.innerText = "Товар успешно добавлен в ваш список!";
                
                setTimeout(() => { msg.innerText = ""; }, 3000);
            }, 600);
        }
    </script>

    <style>
        @keyframes move-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-move-up { animation: move-up 0.4s ease-out forwards; }
    </style>
</body>
</html>
