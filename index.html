<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PriceHunter — 3D Охотник</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg: #090f21; --text: #f7f9ff; --blue: #648bff; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: Arial, sans-serif; overflow-x: hidden; }

        /* Световые пятна на фоне */
        .glow { position: fixed; z-index: -1; width: 50vw; height: 50vw; border-radius: 50%; filter: blur(100px); opacity: 0.15; pointer-events: none; }
        .glow.one { top: -20%; left: -10%; background: #3c68ff; }
        .glow.two { bottom: -20%; right: -10%; background: #8847ff; }

        /* Летающие 3D товары */
        .floating-products { position: fixed; inset: 0; z-index: 0; pointer-events: none; perspective: 1000px; }
        .floating-item {
            position: absolute; font-size: 4rem; opacity: 0.4;
            animation: fly var(--d) ease-in-out infinite alternate;
            transform-style: preserve-3d;
        }
        @keyframes fly {
            from { transform: translate3d(0,0,-100px) rotate(0deg); }
            to { transform: translate3d(20px, 40px, 100px) rotate(15deg); }
        }

        /* Стиль стеклянных карточек */
        .glass {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            transform-style: preserve-3d;
            transition: transform 0.2s ease, border-color 0.3s ease;
        }
        .glass:hover { border-color: rgba(100, 139, 255, 0.5); }

        .search-container { box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <div class="glow one"></div>
    <div class="glow two"></div>

    <!-- Летающий фон -->
    <div class="floating-products">
        <div class="floating-item" style="--d: 6s; top: 15%; left: 10%;">🧥</div>
        <div class="floating-item" style="--d: 8s; top: 40%; right: 15%;">👟</div>
        <div class="floating-item" style="--d: 7s; bottom: 20%; left: 20%;">📱</div>
        <div class="floating-item" style="--d: 9s; bottom: 15%; right: 10%;">⌚</div>
    </div>

    <div class="relative z-10 container mx-auto px-4 py-12">
        <header class="flex justify-between items-center mb-20">
            <a href="#" class="text-3xl font-black tracking-tighter">Price<span class="text-blue-500">Hunter</span> ✦</a>
            <div class="hidden md:block bg-white/5 border border-white/10 px-4 py-2 rounded-full text-xs text-blue-300">
                🚀 Система отслеживания цен в разработке
            </div>
        </header>

        <main class="max-w-3xl mx-auto text-center mb-20">
            <h1 class="text-5xl md:text-7xl font-extrabold mb-6 tracking-tight">
                Находи <span class="bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">лучшее</span>
            </h1>
            <p class="text-gray-400 text-lg mb-10">Вставьте ссылку на любой товар, и мы добавим его в ваш 3D-список.</p>

            <div class="glass search-container p-2 flex flex-col md:flex-row gap-2">
                <input id="productUrl" type="text" placeholder="Ссылка на товар (Ozon, WB, AliExpress...)" 
                       class="flex-1 bg-transparent px-6 py-4 outline-none text-white">
                <button onclick="saveProduct()" class="bg-blue-600 hover:bg-blue-500 text-white px-8 py-4 rounded-xl font-bold transition-all transform active:scale-95">
                    Отслеживать
                </button>
            </div>
            <p id="statusMsg" class="mt-4 text-sm font-medium h-5 text-blue-400"></p>
        </main>

        <!-- Секция со списком -->
        <section class="max-w-5xl mx-auto">
            <div class="flex items-center justify-between mb-8 px-4">
                <h2 class="text-2xl font-bold">Моя охота</h2>
                <span id="counter" class="text-gray-500 text-sm">0 товаров</span>
            </div>

            <div id="productList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Пустое состояние -->
                <div id="emptyState" class="col-span-full glass p-16 text-center border-dashed border-2 opacity-50">
                    <p>Ваш 3D-список пока пуст. Добавьте товар выше!</p>
                </div>
            </div>
        </section>
    </div>

    <script>
        let count = 0;

        function saveProduct() {
            const input = document.getElementById('productUrl');
            const list = document.getElementById('productList');
            const empty = document.getElementById('emptyState');
            const counter = document.getElementById('counter');
            const msg = document.getElementById('statusMsg');

            if (!input.value.trim()) {
                msg.innerText = "⚠️ Пожалуйста, вставьте ссылку";
                return;
            }

            if (empty) empty.remove();

            // Создаем новую 3D карточку
            const card = document.createElement('div');
            card.className = "glass p-6 product-card cursor-pointer relative overflow-hidden";
            card.style.minHeight = "200px";
            
            card.innerHTML = `
                <div class="relative z-10">
                    <div class="text-4xl mb-4">🏷️</div>
                    <p class="text-blue-400 text-[10px] font-bold uppercase mb-2">Товар добавлен</p>
                    <p class="text-gray-200 text-sm italic truncate mb-6">${input.value}</p>
                    <div class="flex justify-between items-center mt-4 pt-4 border-t border-white/10">
                        <span class="text-[10px] text-gray-500 uppercase">Статус</span>
                        <span class="text-[10px] text-emerald-400 font-bold">ОЖИДАНИЕ API</span>
                    </div>
                </div>
            `;

            // Добавляем эффект наклона (3D Tilt)
            addTilt(card);

            list.prepend(card);
            count++;
            counter.innerText = `${count} товаров`;
            input.value = "";
            msg.innerText = "✅ Товар добавлен в очередь!";
            setTimeout(() => msg.innerText = "", 3000);
        }

        function addTilt(element) {
            element.addEventListener('mousemove', (e) => {
                const rect = element.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width;
                const y = (e.clientY - rect.top) / rect.height;
                const rX = (0.5 - y) * 20;
                const rY = (x - 0.5) * 20;
                element.style.transform = `rotateX(${rX}deg) rotateY(${rY}deg) translateY(-5px)`;
            });
            element.addEventListener('mouseleave', () => {
                element.style.transform = `rotateX(0deg) rotateY(0deg) translateY(0px)`;
            });
        }
    </script>
</body>
</html>
